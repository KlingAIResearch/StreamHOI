# ---- Learnable Memory Distance Scaling (MDS) ----
# Set learnable_mds: true to train the per-HOI-block scaling parameter rho (lambda = sigmoid(rho)).
# rho is initialized from temporal_scale_per_block below so sigmoid(rho) == lambda at step 0.
# The HOI-biased block set and their lambda values should be adjusted according to the specific model's bias situation (i.e. which blocks are HOI-biased differs per model).
# Only blocks with lambda != 1.0 become learnable HOI-biased blocks; blocks with 1.0 stay fixed
learnable_mds: true
temporal_scale_per_block:
- 1.0   # block 0
- 1.0   # block 1
- 1.0   # block 2
