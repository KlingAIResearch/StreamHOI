- 1.0   # block 21
- 1.0   # block 22
- 1.0   # block 23
- 1.0   # block 24
- 1.0   # block 25
- 1.0   # block 26
- 1.0   # block 27
- 1.0   # block 28
- 1.0   # block 29

# Inference
data_path: ''
output_folder: ''
inference_iter: -1
num_output_frames: 241
use_ema: false
seed: 0
num_samples: 1
save_with_index: true
switch_frame_indices: 121

global_sink: true
context_noise: 0

generator_ckpt: ''
lora_ckpt: ''

adapter:
  type: "lora"
  rank: 256                    # LoRA rank (typical values: 8, 16, 32, 64)
  alpha: 256                   # LoRA alpha (typically same as rank, but can be different)
  dropout: 0.0                # LoRA dropout rate
  dtype: "bfloat16"          # Data type for LoRA parameters: "bfloat16", "float16", "float32"
  verbose: false              # Whether to print all target module names
