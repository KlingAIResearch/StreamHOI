i2v: true
independent_first_frame: true

# Architecture
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
num_frame_per_block: 4
model_kwargs:
  model_name: Wan2.2-TI2V-5B
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 5
  use_infinite_attention: true

whether_set_per_block_sink_size: true
sink_size_per_block:
- 5  # block 0
- 5  # block 1
- 8  # block 2
- 8  # block 3
- 5  # block 4
- 5  # block 5
- 5  # block 6
- 5  # block 7
- 5  # block 8
- 5  # block 9
- 5  # block 10
- 5  # block 11
- 5  # block 12
- 5  # block 13
- 5  # block 14
- 5  # block 15
- 5  # block 16
- 5  # block 17
- 5  # block 18
- 5  # block 19
- 5  # block 20
- 5  # block 21
- 5  # block 22
- 5  # block 23
- 5  # block 24
- 5  # block 25
- 5  # block 26
- 5  # block 27
- 5  # block 28
- 5  # block 29

whether_set_per_block_temporal_scale: true
default_temporal_scale: 1.0
temporal_scale_per_block:
- 1.0   # block 0
- 0.8   # block 1  (interaction-sensitive)
- 0.8   # block 2  (interaction-sensitive)
- 0.8   # block 3  (interaction-sensitive)
- 1.0   # block 4
- 1.0   # block 5
- 0.8   # block 6  (interaction-sensitive)
- 1.0   # block 7
- 1.0   # block 8
- 1.0   # block 9
- 1.0   # block 10
- 1.0   # block 11
- 1.0   # block 12
- 1.0   # block 13
